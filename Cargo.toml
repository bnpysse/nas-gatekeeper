[package]
name = "nas-gatekeeper"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
