# ── 第一步: HTTP 临时配置 (用于 Certbot 申请证书) ──
# 申请成功后替换为 stack.conf

server {
    listen 80;
    server_name stack.donglida.xyz;

    # Certbot ACME 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
