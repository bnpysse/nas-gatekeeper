# ==========================================
# stack.donglida.xyz — Nginx 反向代理配置
# 证书申请成功后启用此文件, 删除 init.conf
# ==========================================

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name stack.donglida.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl;
    http2 on;
    server_name stack.donglida.xyz;

    # ── Let's Encrypt 证书 ──
    ssl_certificate     /etc/letsencrypt/live/stack.donglida.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stack.donglida.xyz/privkey.pem;

    # ── SSL 安全参数 ──
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ── 反向代理到 Streamlit ──
    location / {
        proxy_pass         http://omni:8501;
        proxy_http_version 1.1;

        # WebSocket 支持 (Streamlit 必须)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;   # Streamlit 长连接
        proxy_buffering    off;
    }

    # ── Streamlit 静态资源缓存 ──
    location ~* \.(js|css|png|jpg|ico|woff2?)$ {
        proxy_pass http://omni:8501;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
